name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check hitflop app tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        run: python -m pytest --cov=hitflop --cov-report=term --cov-report=xml
      - name: Keep the coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t movie-hit-flop .
      - name: Start the app and wait until it is healthy
        run: |
          docker run -d --name app -p 8501:8501 movie-hit-flop
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then echo "healthy after ${i}s"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: The package imports and predicts inside the container
        run: |
          docker exec app python -c "
          from hitflop import artifacts as A, predict as P
          art = A.load()
          out = P.predict(art, {'name': 't', 'language': 'te', 'release_date': '2027-01-15', 'budget': 8e6, 'runtime': 140, 'genres': ['Action']}, 'basic')
          assert 0 <= out['probability'] <= 1, out
          print('prediction ok', round(out['probability'], 3))"
      - name: Show logs on failure
        if: failure()
        run: docker logs app
